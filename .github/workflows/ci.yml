name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # net8.0 (Sim.Core) собирается SDK 10, но для запуска net8.0-сборок нужен рантайм 8.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore traffic-city.sln

      - name: Build
        run: dotnet build traffic-city.sln -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test traffic-city.sln -c Release --no-build

      # Параметры bench и повтор при шуме p95 - в scripts/bench-gate.sh (общие с Stop-хуком, ADR-0007).
      - name: Bench s1k + compare with CI baseline
        if: hashFiles('perf/baseline-ci.json') != ''
        run: bash scripts/bench-gate.sh --out perf/results/s1k.json --baseline perf/baseline-ci.json

      - name: Bench s1k + check budget (no CI baseline yet)
        if: hashFiles('perf/baseline-ci.json') == ''
        run: bash scripts/bench-gate.sh --out perf/results/s1k.json --budget-p95-ms 1.0

      # CI-baseline снимается из этого вывода (ADR-0007).
      - name: Print bench JSON
        if: always()
        run: |
          echo "=== BENCH-JSON-BEGIN ==="
          cat perf/results/s1k.json
          echo "=== BENCH-JSON-END ==="

      - name: Upload perf results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: perf/results/*.json
          if-no-files-found: ignore

  # Rust-пилот ядра (ADR-0022, docs/design/rust-pilot.md §9). Шаг ffi-smoke добавляет задача R6.
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      # rustup предустановлен; rust-toolchain.toml ставит 1.97.0 + clippy/rustfmt при первом вызове cargo.
      - name: Show toolchain
        run: rustc --version && cargo --version

      - uses: actions/cache@v4
        with:
          path: rust/target
          key: rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      - name: Build tc-ffi (release)
        if: hashFiles('rust/crates/tc-ffi/Cargo.toml') != ''
        run: cargo build --release -p tc-ffi --locked

      - name: Third-party crates check
        run: bash ../scripts/rust-check.sh --deps-only
